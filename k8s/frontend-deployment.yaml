apiVersion: apps/v1
kind: Deployment
metadata:
  name: bank-registry-frontend
  labels:
    app: bank-registry-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bank-registry-frontend
  template:
    metadata:
      labels:
        app: bank-registry-frontend
    spec:
      containers:
      - name: frontend
        image: bank-registry-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  selector:
    app: bank-registry-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: LoadBalancer
